<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Selección de correos</title>
<style>
  :root { --bg:#f4f7fb; --card:#fff; --txt:#1f3a5f; --sub:#555; --ok:#2e7d32; --no:#e65100; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10161f; --card:#1a2330; --txt:#e3ecf7; --sub:#a9b6c6; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); font-family:Arial, sans-serif; padding:16px; box-sizing:border-box; }
  .card { background:var(--card); border-radius:12px; padding:28px 24px; max-width:420px; width:100%;
          text-align:center; box-shadow:0 4px 18px rgba(0,0,0,.12); }
  h1 { font-size:22px; margin:8px 0; color:var(--txt); }
  p { color:var(--sub); font-size:15px; line-height:1.4; }
  .ico { font-size:46px; }
</style>
</head>
<body>
<div class="card"><div class="ico" id="ico">⏳</div><h1 id="tit">Registrando…</h1><p id="txt"></p></div>
<script>
// Botones del resumen diario "Selección de correos importantes": guarda la decisión en Firebase
// (solo un código opaco, nunca la dirección) y el script local la aplica en la próxima revisión.
(function () {
  var q = new URLSearchParams(location.search), h = q.get('h') || '', d = q.get('d');
  var ico = document.getElementById('ico'), tit = document.getElementById('tit'), txt = document.getElementById('txt');
  if (!/^[0-9a-f]{20}$/.test(h) || (d !== 'i' && d !== 'n')) {
    ico.textContent = '⚠️'; tit.textContent = 'Enlace no válido'; return;
  }
  fetch('https://arbolito-golf-default-rtdb.europe-west1.firebasedatabase.app/seleccion-correos/' + h + '.json', {
    method: 'PUT', body: JSON.stringify({ d: d, ts: Date.now() })
  }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    ico.textContent = d === 'i' ? '✔' : '✘';
    ico.style.color = d === 'i' ? 'var(--ok)' : 'var(--no)';
    tit.textContent = d === 'i' ? 'Marcado como importante' : 'Marcado como no importante';
    txt.textContent = 'Listo, ya podés cerrar esta pestaña. Se aplica en la próxima revisión.';
  }).catch(function (e) {
    ico.textContent = '⚠️'; tit.textContent = 'No se pudo registrar';
    txt.textContent = 'Probá de nuevo en un rato (' + e.message + ').';
  });
})();
</script>
</body>
</html>
